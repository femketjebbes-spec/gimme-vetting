# GitLab CI/CD Pipeline
# Stages: build -> test -> security-scan -> deploy-staging -> deploy-production

stages:
  - build
  - test
  - security-scan
  - deploy-staging
  - deploy-production

variables:
  NODE_VERSION: "20"

# ======================
# BACKEND JOB - BUILD
# ======================
backend-build:
  stage: build
  image: maven:3.9-eclipse-temurin-17
  script:
    - mvn -f 5-backend/pom.xml clean package -DskipTests
  artifacts:
    paths:
      - 5-backend/business-service/target/*.jar
    expire_in: 1 hour

# ======================
# FRONTEND JOB - BUILD
# ======================
frontend-build:
  stage: build
  image: node:${NODE_VERSION}-alpine
  script:
    - cd 4-frontend && npm ci && npm run build
  artifacts:
    paths:
      - 4-frontend/dist
    expire_in: 1 hour
  cache:
    key: frontend-npm
    paths:
      - 4-frontend/node_modules
      - 4-frontend/package-lock.json
    policy: push

# ======================
# BACKEND JOB - TEST
# ======================
backend-test:
  stage: test
  image: maven:3.9-eclipse-temurin-17
  script:
    - mvn -f 5-backend/pom.xml clean test
    - mvn -f 5-backend/pom.xml verify -DskipUnitTests=true
  artifacts:
    reports:
      junit:
        - 5-backend/business-service/target/surefire-reports/TEST-*.xml
    paths:
      - 5-backend/business-service/target/surefire-reports/
    expire_in: 7 days
  cache:
    key: backend-maven
    paths:
      - ~/.m2/repository
    policy: pull

# ======================
# FRONTEND JOB - TEST
# ======================
frontend-test:
  stage: test
  image: node:${NODE_VERSION}-alpine
  script:
    - npm --prefix 4-frontend ci
    - npm --prefix 4-frontend run lint || true
    - npm --prefix 4-frontend test -- --ci --coverage --coverageReporters=json-summary --coverageReporters=cobertura --outputFile=.jest-results.json
  dependencies: []
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: 4-frontend/coverage/cobertura-coverage.xml
    paths:
      - 4-frontend/.jest-results.json
    expire_in: 7 days
  cache:
    key: frontend-npm
    paths:
      - 4-frontend/node_modules
      - 4-frontend/package-lock.json
    policy: pull

# ======================
# SECURITY SCAN
# ======================
security-scan:
  stage: security-scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  dependencies:
    - backend-build
    - frontend-build
  script:
    - trivy fs --security vulns --severity HIGH,CRITICAL --format sarif --output trivy-backend.sarif 5-backend || true
    - trivy fs --security vulns --severity HIGH,CRITICAL --format sarif --output trivy-frontend.sarif 4-frontend || true
  artifacts:
    paths:
      - trivy-backend.sarif
      - trivy-frontend.sarif
    expire_in: 30 days

# ======================
# BACKEND - DEPLOY TO STAGING (SSH)
# ======================
backend-deploy-staging:
  stage: deploy-staging
  image: ubuntu:22.04
  before_script:
    - apt-get update && apt-get install -y openssh-client
    - mkdir -p ~/.ssh
    - cp "$DEPLOY_SSH_PRIVATE_KEY" ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -p ${DEPLOY_SERVER_PORT} $DEPLOY_SERVER_HOST >> ~/.ssh/known_hosts
  script:
    - scp -o StrictHostKeyChecking=no -P ${DEPLOY_SERVER_PORT} $(ls 5-backend/business-service/target/*.jar | head -n 1) $DEPLOY_SERVER_USER@$DEPLOY_SERVER_HOST:/opt/gimme/app.jar
    - ssh -o StrictHostKeyChecking=no -p ${DEPLOY_SERVER_PORT} $DEPLOY_SERVER_USER@$DEPLOY_SERVER_HOST "sudo systemctl restart gimme-backend"
    - sleep 10
    - ssh -o StrictHostKeyChecking=no -p ${DEPLOY_SERVER_PORT} $DEPLOY_SERVER_USER@$DEPLOY_SERVER_HOST "journalctl -u gimme-backend -n 20 --no-pager"
  environment:
    name: staging
    url: http://$DEPLOY_SERVER_HOST:8082
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "dev"'
  dependencies:
    - backend-build

# ======================
# FRONTEND - DEPLOY TO STAGING
# ======================
frontend-deploy-staging:
  stage: deploy-staging
  image: ubuntu:22.04
  before_script:
    - apt-get update && apt-get install -y openssh-client
    - mkdir -p ~/.ssh
    - cp "$DEPLOY_SSH_PRIVATE_KEY" ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -p ${DEPLOY_SERVER_PORT} $DEPLOY_SERVER_HOST >> ~/.ssh/known_hosts
  script:
    - scp -o StrictHostKeyChecking=no -P ${DEPLOY_SERVER_PORT} -r 4-frontend/dist/* $DEPLOY_SERVER_USER@$DEPLOY_SERVER_HOST:/opt/gimme/frontend/
  environment:
    name: staging
    url: https://staging.gimmevettingsolution.com
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "dev"'
  dependencies:
    - frontend-build

# ======================
# BACKEND - DEPLOY TO PRODUCTION (SSH)
# ======================
backend-deploy-production:
  stage: deploy-production
  image: ubuntu:22.04
  before_script:
    - apt-get update && apt-get install -y openssh-client
    - mkdir -p ~/.ssh
    - cp "$DEPLOY_SSH_PRIVATE_KEY" ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -p ${DEPLOY_SERVER_PORT} $DEPLOY_SERVER_HOST >> ~/.ssh/known_hosts
  script:
    - scp -o StrictHostKeyChecking=no -P ${DEPLOY_SERVER_PORT} $(ls 5-backend/business-service/target/*.jar | head -n 1) $DEPLOY_SERVER_USER@$DEPLOY_SERVER_HOST:/opt/gimme/app.jar
    - ssh -o StrictHostKeyChecking=no -p ${DEPLOY_SERVER_PORT} $DEPLOY_SERVER_USER@$DEPLOY_SERVER_HOST "sudo systemctl restart gimme-backend"
    - sleep 10
    - ssh -o StrictHostKeyChecking=no -p ${DEPLOY_SERVER_PORT} $DEPLOY_SERVER_USER@$DEPLOY_SERVER_HOST "journalctl -u gimme-backend -n 20 --no-pager"
  environment:
    name: production
    url: http://$DEPLOY_SERVER_HOST:8082
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  allow_failure: false
  dependencies:
    - backend-build

# ======================
# FRONTEND - DEPLOY TO PRODUCTION
# ======================
frontend-deploy-production:
  stage: deploy-production
  image: ubuntu:22.04
  before_script:
    - apt-get update && apt-get install -y openssh-client
    - mkdir -p ~/.ssh
    - cp "$DEPLOY_SSH_PRIVATE_KEY" ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -p ${DEPLOY_SERVER_PORT} $DEPLOY_SERVER_HOST >> ~/.ssh/known_hosts
  script:
    - scp -o StrictHostKeyChecking=no -P ${DEPLOY_SERVER_PORT} -r 4-frontend/dist/* $DEPLOY_SERVER_USER@$DEPLOY_SERVER_HOST:/opt/gimme/frontend/
  environment:
    name: production
    url: https://gimmevettingsolution.com
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  allow_failure: false
  dependencies:
    - frontend-build
