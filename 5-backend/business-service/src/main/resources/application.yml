# Default profile is 'local' — zero external dependencies (H2 in-memory DB)
# Run with: mvn spring-boot:run (no extra flags needed)
# Override with: mvn spring-boot:run -Dspring-boot.run.profiles=prod
#               or: SPRING_PROFILES_ACTIVE=prod mvn spring-boot:run

spring:
  application:
    name: business-service
  datasource:
    url: jdbc:h2:mem:gimmelite;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8082

gimme:
  poc-store-path: ${POC_STORE_PATH:/tmp/poc-store}
  excel-store-path: ${EXCEL_STORE_PATH:/tmp/excel-store}

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  flyway:
    enabled: false

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://localhost:5432/gimme_vetting_business
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
