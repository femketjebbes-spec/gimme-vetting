spring:
  application:
    name: client-service
  datasource:
    url: jdbc:postgresql://localhost:5432/gimme_vetting_client
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8081
